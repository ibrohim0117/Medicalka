name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    name: Linter va tiplar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bog'liqliklarni o'rnatish
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: ruff format
        run: ruff format --check .

      - name: mypy
        run: mypy app

  test:
    name: Testlar
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: medicalka
          POSTGRES_PASSWORD: medicalka
          POSTGRES_DB: medicalka
        ports: ["5432:5432"]
        # Testlar boshlanishidan oldin baza tayyor bo'lsin.
        options: >-
          --health-cmd "pg_isready -U medicalka"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://medicalka:medicalka@localhost:5432/medicalka_test
      JWT_SECRET: ci-uchun-jwt-siri-kamida-o-ttiz-ikki-belgi
      ADMIN_TOKEN: ci-uchun-admin-token

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bog'liqliklarni o'rnatish
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest -v

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: runtime tasvirini yig'ish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: dev tasvirini yig'ish
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          push: false
          cache-from: type=gha
