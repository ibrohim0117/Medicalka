# Loyiha
[project]
name = "medicalka-social"
version = "0.1.0"
description = "Tibbiyot hamjamiyati uchun ijtimoiy tarmoq API (FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ibrohim" }]
keywords = ["fastapi", "social", "medical", "async", "postgresql"]

dependencies = [
    # Web
    "fastapi>=0.115,<0.117",
    "uvicorn[standard]>=0.30,<0.35",
    "python-multipart>=0.0.9",       # form-data / fayl yuklash

    # Baza
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<0.31",           # async driver — FastAPI uchun
    "psycopg2-binary>=2.9,<3.0",     # sync driver — Celery va Alembic uchun

    # Validatsiya va sozlamalar
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",     # EmailStr uchun zarur

    # Xavfsizlik
    "pyjwt>=2.8,<3.0",
    "bcrypt>=4.1,<5.0",

    # Fon vazifalari
    "celery[redis]>=5.4,<6.0",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<0.25",
    "pytest-cov>=5.0,<7.0",
    "httpx>=0.27,<0.29",             # ASGI test klienti
    "aiosqlite>=0.20,<0.22",         # testlar uchun xotiradagi baza
    "ruff>=0.5,<0.13",
    "mypy>=1.10,<2.0",
]

[project.urls]
Repository = "https://github.com/ibrohim/medicalka-social"

# Build
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Barcha subpaketlar aniq sanab o'tilgan. Faqat `["app"]` yozilsa
# setuptools ichki paketlarni (app.core, app.api, ...) qo'shmaydi va
# konteynerda `ModuleNotFoundError` chiqadi.
packages = [
    "app",
    "app.api",
    "app.api.v1",
    "app.core",
    "app.db",
    "app.models",
    "app.repositories",
    "app.schemas",
    "app.services",
    "app.worker",
]

# pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Har bir `async def test_...` ni alohida marker'siz ishlatish uchun.
asyncio_mode = "auto"
addopts = [
    "-q",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",                                # ogohlantirish = xato
    "ignore::DeprecationWarning:celery.*",  # uchinchi tomon kutubxonalari
    "ignore::DeprecationWarning:kombu.*",
]
markers = [
    "slow: sekin ishlaydigan testlar (`-m 'not slow'` bilan o'tkazib yuboriladi)",
    "integration: haqiqiy Postgres/Redis talab qiladigan testlar",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/worker/celery_app.py", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle — xatolar
    "W",    # pycodestyle — ogohlantirishlar
    "F",    # pyflakes
    "I",    # isort — import tartibi
    "N",    # pep8-naming
    "UP",   # pyupgrade — zamonaviy sintaksis
    "B",    # flake8-bugbear — keng tarqalgan xatolar
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff'ning o'z qoidalari
]
ignore = [
    "B008",   # FastAPI'da `Depends()` ni argument sifatida yozish odatiy
    "RUF001", # lotin/kirill o'xshash belgilar — o'zbekcha matnlar uchun
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Testlarda uzun `assert` va fixture nomlarining soyalanishi normal.
"tests/*" = ["S101", "N802"]
# Alembic shablonidagi import tartibi ruff'ga bo'ysunmaydi.
"migrations/env.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
# `docstring-code-format` yoqilmagan: docstring ichidagi endpoint ro'yxatlari
# va jadvallarni ruff Python kodi deb o'ylab, qayta formatlashga urinadi.

# mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
